name: Validate Biblia Search

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/biblia/BibliaBuscar.tsx"
      - "src/features/biblia/referenceSearch.ts"
      - "src/features/biblia/referenceSearch.test.ts"
      - "src/services/bibliaService.ts"
      - "src/pages/biblia/BibliaEstudio.tsx"
      - "src/App.tsx"
      - "hosting/api/biblia.php"
      - ".github/workflows/validate-biblia-search.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: PHP syntax
        run: php -l hosting/api/biblia.php
