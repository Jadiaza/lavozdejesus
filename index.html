  <body>
    <div id="root">
      <style>
        .initial-splash {
          position: fixed;
          inset: 0;
          display: flex;
          min-height: 100dvh;
          width: 100%;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background: #020713;
        }

        .initial-splash::before {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, rgba(224, 164, 50, 0.18), transparent 42%);
        }

        .initial-splash__content {
          position: relative;
          display: flex;
          width: min(72vw, 280px);
          flex-direction: column;
          align-items: center;
        }

        .initial-splash__logo {
          width: min(58vw, 220px);
          height: auto;
          filter: brightness(1.2) drop-shadow(0 0 18px rgba(212, 165, 76, 0.55));
        }

        .initial-splash__track {
          margin-top: 24px;
          height: 7px;
          width: 100%;
          overflow: hidden;
          border: 1px solid rgba(255, 186, 97, 0.28);
          border-radius: 9999px;
          background: rgba(0, 0, 0, 0.38);
          box-shadow: 0 0 18px rgba(245, 132, 35, 0.25);
        }

        .initial-splash__bar {
          height: 100%;
          width: 50%;
          border-radius: inherit;
          background: linear-gradient(90deg, #f97316, #fcd34d, #fb923c);
          box-shadow: 0 0 18px rgba(245, 132, 35, 0.6);
          animation: initial-splash-loader 1.05s ease-in-out infinite;
        }

        @keyframes initial-splash-loader {
          0% {
            transform: translateX(-105%);
          }

          48% {
            transform: translateX(35%);
          }

          100% {
            transform: translateX(205%);
          }
        }
      </style>
      <div class="initial-splash" aria-label="Cargando La Voz de Jesús">
        <div class="initial-splash__content">
          <img class="initial-splash__logo" src="/logo.png" alt="La Voz de Jesús" />
          <div class="initial-splash__track" aria-hidden="true">
            <div class="initial-splash__bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
